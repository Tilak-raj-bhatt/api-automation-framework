# ---------------------------------------------------------------------------
# Defaults shared by every environment.
#
# Precedence (highest wins):
#   1. -Dframework.<key>=value        (JVM system property)
#   2. FRAMEWORK_<KEY>                (environment variable, dots become _)
#   3. config/<env>.properties
#   4. this file
# ---------------------------------------------------------------------------

base.url=https://dummyjson.com
base.path=

# Network timeouts in milliseconds. A hung CI job is worse than a fast failure.
timeout.connection.ms=15000
timeout.socket.ms=30000

# Set to true (or FRAMEWORK_LOG_REQUESTS=true) when debugging a failing call.
log.requests=false

# Only enable for test servers with self-signed certificates. Never in production.
relaxed.https=false

# Retries mask real defects. Disabled by default; see RetryAnalyzer.
retry.enabled=false
retry.count=1
retry.delay.ms=1000

# Public DummyJSON demo account.
auth.username=emilys
auth.password=emilyspass
